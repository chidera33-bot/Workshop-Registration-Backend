<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Login</title></head>
<body>

<nav>
    <strong>U-WRS</strong> | <a href="/">Home</a>
</nav>

<hr>
<h2>Login</h2>

<div th:if="${param.error}" style="color:red">Invalid email or password.</div>
<div th:if="${param.logout}" style="color:green">You have been logged out.</div>
<div th:if="${success}" th:text="${success}" style="color:green"></div>

<form th:action="@{/login}" method="post">
    <label>Email: <input type="email" name="username" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>
    <button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="/register">Register</a></p>

</body>
</html>
